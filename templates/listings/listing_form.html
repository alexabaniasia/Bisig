{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Listing · Bisig</title>
    <link rel="stylesheet" href="{% static 'css/common/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/listings/listing_form.css' %}">
</head>
<body>
    {% include 'partials/topbar.html' with active='browse' %}

    <main class="wrap">
        <h1>Post a listing</h1>
        <p class="subtitle">Offer a skill, or ask your neighbors for help with something.</p>

        <form method="post" class="stack card">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Post listing</button>
        </form>

        <a href="{% url 'listings:listing_list' %}" class="back-link">Back to listings</a>
    </main>
</body>
</html>
