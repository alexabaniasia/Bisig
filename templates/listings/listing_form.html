{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Listing · Bisig</title>
    <link rel="stylesheet" href="{% static 'css/common/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/listings/listing_form.css' %}">
</head>
<body>
    {% include 'partials/topbar.html' with active='browse' %}

    <main class="container narrow-sm page">
        <div class="page-title">
            <span class="kicker">New listing</span>
            <h1>Post a listing</h1>
            <p>Offer a skill, or ask your neighbors for help with something.</p>
        </div>

        <form method="post" class="stack card form-card">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Post listing</button>
        </form>

        <a href="{% url 'listings:listing_list' %}" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to listings
        </a>
    </main>

    {% include 'partials/footer.html' %}
</body>
</html>
