{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Bisig</title>
    <link rel="stylesheet" href="{% static 'css/common/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/login/login.css' %}">
</head>
<body>
    <div class="board">
        <div class="side-panel">
            <h1>Bisig</h1>
            <p class="tagline">Empowering local talent, strengthening community connections.</p>
            <div class="skill-tags">
                <span>Tutoring</span>
                <span>Plumbing</span>
                <span>Tech support</span>
                <span>Catering</span>
                <span>Errands</span>
            </div>
        </div>
        <div class="form-panel">
            <h2>Log in</h2>
            <p class="lede">Pick up where your neighbors left off.</p>

            {% if error %}
                <p class="error-banner" style="margin-left:0; margin-right:0;">{{ error }}</p>
            {% endif %}

            <form method="post" class="stack">
                {% csrf_token %}
                <p>
                    <label for="id_username">Username</label>
                    <input type="text" id="id_username" name="username" placeholder="Your username" required>
                </p>
                <p>
                    <label for="id_password">Password</label>
                    <input type="password" id="id_password" name="password" placeholder="Your password" required>
                </p>
                <button type="submit" class="btn">Log in</button>
            </form>

            <p class="back-link">Don't have an account? <a href="{% url 'register:register' %}">Register here</a></p>
        </div>
    </div>
</body>
</html>
